name: publish npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3" # the patch with the fix of GO-2026-6809 (crypto/x509), after 6617 and 6612/6613, which the runner's cache lacks; the wasm job of ci.yml builds with it too
          cache: false # a cache saved by a tag is restored by nothing else

      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: "0.42.0" # the wasm job of ci.yml builds with it too
          install-binaryen: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # npm trusted publishing requires npm 11.5.1 or newer.
      - name: update npm
        run: npm install --global npm@11.5.1

      - name: check tool versions
        run: |
          node --version
          npm --version
          go version
          tinygo version

      - run: npm ci
      - run: npm test
      - run: npm run build:wasm
      - run: npm run size:npm
      - run: npm pack --dry-run --workspaces

      - name: verify release tag matches package versions
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const packages = [
            "core",
            "render",
            "convert",
            "viewer",
            "convert-pdf-epub",
            "convert-office",
            "convert-all",
          ];
          const ref = process.env.RELEASE_REF ?? "";
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(ref)) {
            throw new Error(`release workflow must run on a semver tag such as v0.1.0 (got ${ref})`);
          }
          const version = ref.slice(1);
          for (const name of packages) {
            const path = `packages/${name}/package.json`;
            const pkg = JSON.parse(await readFile(path, "utf8"));
            if (pkg.version !== version) throw new Error(`${path}: ${pkg.version} does not match ${version}`);
          }
          NODE

      - name: publish packages
        run: |
          set -euo pipefail
          # npm obtains a short-lived publish credential from GitHub OIDC.
          for package in \
            @bdfkit/core \
            @bdfkit/render \
            @bdfkit/convert \
            @bdfkit/viewer \
            @bdfkit/convert-pdf-epub \
            @bdfkit/convert-office \
            @bdfkit/convert-all; do
            if ! npm publish --workspace="$package" --access=public; then
              echo "::warning title=Publish skipped::$package could not be published; continuing with remaining packages."
            fi
          done

  # The conformance suite (package conformance): the inputs other readers
  # check themselves with, attached to the release of the tag.
  conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3" # the patch with the fix of GO-2026-6809 (crypto/x509), after 6617 and 6612/6613, which the runner's cache lacks; the wasm job of ci.yml builds with it too
          cache: false # a cache saved by a tag is restored by nothing else

      - name: write the conformance suite
        run: |
          go run ./cmd/bdf conformance -testdata testdata bdf-conformance
          tar czf "bdf-conformance-${GITHUB_REF_NAME}.tar.gz" bdf-conformance

      - uses: actions/upload-artifact@v7
        with:
          name: bdf-conformance
          path: bdf-conformance-*.tar.gz

      - name: attach it to the release of the tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the release of the tag, or a draft one to publish by hand when there is none yet
          gh release upload "$GITHUB_REF_NAME" "bdf-conformance-${GITHUB_REF_NAME}.tar.gz" --clobber ||
            gh release create "$GITHUB_REF_NAME" "bdf-conformance-${GITHUB_REF_NAME}.tar.gz" --draft --generate-notes
